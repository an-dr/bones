<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bones telemetry</title>
<style>
  :root {
    color-scheme: dark;
    font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
    background: #090c10;
    color: #f2f5f7;
  }

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background:
    radial-gradient(circle at 12% 0%, #193b3a 0, transparent 32rem),
    linear-gradient(145deg, #0b1115, #090c10 62%); }
  main { width: min(960px, 100%); margin: auto; padding: 56px 40px; }
  header { display: flex; justify-content: space-between; gap: 24px; align-items: start; }
  .eyebrow { color: #6ee7c7; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin: 8px 0 4px; font-size: clamp(32px, 5vw, 58px); letter-spacing: -.045em; }
  .muted { color: #91a0aa; }
  .live { display: flex; align-items: center; gap: 9px; padding: 9px 13px;
    border: 1px solid #29423f; border-radius: 99px; background: #11211f; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6ee7c7;
    box-shadow: 0 0 18px #6ee7c7; }
  .grid { display: grid; grid-template-columns: 1fr 1.7fr; gap: 18px; margin-top: 42px; }
  article { min-height: 260px; padding: 28px; border: 1px solid #202a31;
    border-radius: 22px; background: rgba(16, 22, 27, .86); box-shadow: 0 24px 60px #0006; }
  .label { color: #91a0aa; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  #value { margin-top: 18px; font-size: 92px; font-weight: 750; letter-spacing: -.07em; }
  #history { height: 150px; display: flex; gap: 8px; align-items: end; margin-top: 24px; }
  .bar { flex: 1; min-width: 8px; border-radius: 6px 6px 2px 2px;
    background: linear-gradient(#79f2d2, #23776c); transition: height .25s ease; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  button { border: 1px solid #31544e; border-radius: 10px; padding: 10px 14px;
    color: #dffaf3; background: #15302c; cursor: pointer; }
  button:hover { background: #1c403a; }
  button.secondary { border-color: #333d44; color: #aeb8be; background: #171d21; }
  #status { margin-top: 22px; color: #6ee7c7; }
  @media (max-width: 680px) {
    main { padding: 32px 20px; }
    header { display: block; }
    .live { width: fit-content; margin-top: 18px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
<main>
  <header>
    <div>
      <div class="eyebrow">Bones runtime</div>
      <h1>Extension telemetry</h1>
      <div class="muted">Native web presentation, WASM-owned data.</div>
    </div>
    <div class="live"><span class="dot"></span><span>Live bus feed</span></div>
  </header>
  <section class="grid">
    <article>
      <div class="label">Current sequence</div>
      <div id="value">—</div>
      <div id="status">Connecting…</div>
    </article>
    <article>
      <div class="label">Recent history</div>
      <div id="history"></div>
      <div class="actions">
        <button id="refresh">Request history</button>
        <button id="close" class="secondary">Close dashboard</button>
      </div>
    </article>
  </section>
</main>
<script>
  const post = value => window.ipc.postMessage(JSON.stringify(value));
  let requestId = 1;

  window.addEventListener("bones-message", event => {
    const message = JSON.parse(event.detail);
    if (message.kind === "update") {
      document.querySelector("#value").textContent = message.value;
      document.querySelector("#status").textContent = "Streaming metrics/updated";
    }
    if (message.kind === "history") {
      const values = message.values ?? [];
      const max = Math.max(1, ...values);
      document.querySelector("#history").replaceChildren(...values.map(value => {
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.title = String(value);
        bar.style.height = `${Math.max(8, value / max * 100)}%`;
        return bar;
      }));
    }
    if (message.kind === "error") {
      document.querySelector("#status").textContent = message.message;
    }
    post({ ack: message.kind });
  });

  document.querySelector("#refresh").addEventListener("click", () =>
    post({ get: "history", id: ++requestId }));
  document.querySelector("#close").addEventListener("click", () => post({ close: true }));

  post({ ready: true });
  post({ get: "history", id: requestId });
</script>
</html>
