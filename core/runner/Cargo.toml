[package]
name = "runner"
version = "0.1.0"
edition = "2021"

[features]
default = []
web = ["dep:web"]

[dependencies]
bones-messages = { path = "../../shared/bones-messages" }
bus = { path = "../bus" }
wasm-extensions = { path = "../wasm-extensions" }
logging = { path = "../logging" }
platform = { path = "../platform" }
renderer = { path = "../renderer" }
ui = { path = "../ui" }
web = { path = "../web", features = ["wry-backend"], optional = true }
wasmtime = { version = "47.0.0", features = ["component-model"] }

[dev-dependencies]
# test-mode: cargo test runs tests on worker threads, not the process's
# main thread; SDL refuses to init anywhere else unless this is set.
sdl3 = { version = "0.18.4", features = ["build-from-source-static", "test-mode"] }
audio = { path = "../audio" }
