# Every gate `cargo xtask test` enforces, on every platform bones claims, plus
# the commit attribution check -- on every push to any branch and every pull
# request. The workflow only calls xtask: the logic lives there, so a local
# run and a CI run are the same command.
name: CI

on:
  push:
  pull_request:

jobs:
  commits:
    name: Commit attribution
    runs-on: ubuntu-24.04
    steps:
      # Submodules too: cargo loads the whole workspace, vendor/pubsub-bus
      # included, before it can build xtask.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # The commits this event adds. A pull request: its own. A branch push:
      # everything the branch adds over main, which survives force-pushes. A
      # push to main: the new commits, or the head alone when "before" is
      # absent or no longer in history.
      - name: No commit credits an AI tool as an author
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            cargo xtask check-commits "$PR_BASE..$PR_HEAD"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            cargo xtask check-commits "origin/main..$GITHUB_SHA"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            cargo xtask check-commits "$BEFORE..$GITHUB_SHA"
          else
            cargo xtask check-commits -1 "$GITHUB_SHA"
          fi
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, runner: windows-latest }
          - { name: windows-arm64, runner: windows-11-arm }
          - { name: linux-x64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # The package list lives in xtask (cargo xtask linux-packages), so CI
      # and a developer's machine install the same thing.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb $(cargo xtask linux-packages)
      - name: Prerequisites
        run: cargo xtask doctor
      # The SDL tests open real windows, so Linux needs a display: xvfb-run
      # provides a virtual one.
      - name: Gates and tests
        if: runner.os == 'Windows'
        run: cargo xtask test
      - name: Gates and tests
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo xtask test

  # A guest that is not Rust: the TypeScript example's codec against the
  # conformance vectors, then the built component through the real extension
  # host. Linux x64 only, because jco's componentizer ships no prebuilt
  # binary for every platform the engine supports.
  typescript-guest:
    name: TypeScript guest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: typescript-guest
      - name: Codec against the conformance vectors
        working-directory: examples/extensions/ts-demo
        run: |
          npm ci
          npm test
      - name: Component
        working-directory: examples/extensions/ts-demo
        run: npm run build
      - name: Through the extension host
        run: cargo test -p bones-test --test typescript_guest -- --ignored

  # A release build of every platform and variant, on every push, so packaging
  # is exercised as often as the tests. Nothing is uploaded: a release is
  # source, and the binaries are built where they are used. Windows builds web
  # panels always (WebView2 is part of the OS); Linux builds both variants.
  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64-web, runner: windows-latest, features: web }
          - { name: windows-arm64-web, runner: windows-11-arm, features: web }
          - { name: linux-x64, runner: ubuntu-24.04, features: "" }
          - { name: linux-x64-web, runner: ubuntu-24.04, features: web }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, features: "" }
          - { name: linux-arm64-web, runner: ubuntu-24.04-arm, features: web }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.features }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cargo xtask linux-packages)
      - name: Release build
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo xtask dist --no-archive --features "${{ matrix.features }}"
          else
            cargo xtask dist --no-archive
          fi

  # A v* tag publishes a GitHub Release of its source: the tag's notes from
  # CHANGELOG.md, and the source archives GitHub attaches to every release.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish the tag's changelog section
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($0 ~ "^## engine " v "( |$)") ; next }
            found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## engine $version' section"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "bones $GITHUB_REF_NAME" --notes-file notes.md
