[package]
name = "xtask"
description = "Build automation for this repository: tests, release archives, and examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Builds extensions and finds their .wasm (ADR-043).
bones-build = { path = "../crates/bones-build" }
# Derives wit/wire-format.schema.json from the types that read the spec.
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
