# "upgrader", not "updater": Windows auto-elevates executables whose filename
# contains "update", "install", "setup" or "patch". See docs/adr/ADR-033.
[package]
name = "bones-upgrader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Self-update for a bones desktop application: version folders, a permanent launcher, staged installs and rollback."

publish.workspace = true

# The reference launcher, the other half of the mechanism this crate
# implements: an application can only replace an entry point that something
# else built. A host normally declares its own `[[bin]]` under the name its
# users type, and `launcher::run` is public for exactly that.
[[bin]]
name = "bones-launcher"
path = "src/bin/bones-launcher.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
base64 = "0.22"
dirs = "6.0.0"
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.20"
