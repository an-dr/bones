[package]
name = "bones-module-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
wry-backend = [
    "dep:raw-window-handle",
    "bones-kernel/platform",
    "dep:sdl3",
    "dep:send_wrapper",
    "dep:serde_json",
    "dep:wry",
]

[dependencies]
bones-messages = { path = "../../bones-messages" }
bones-kernel = { path = "../bones-kernel", default-features = false }
raw-window-handle = { version = "0.6.2", optional = true }
sdl3 = { version = "0.18.4", features = ["build-from-source-static", "raw-window-handle"], optional = true }
send_wrapper = { version = "0.6.0", optional = true }
serde_json = { version = "1.0", optional = true }
wry = { version = "0.55.1", optional = true }

[dev-dependencies]
sdl3 = { version = "0.18.4", features = ["build-from-source-static", "raw-window-handle", "test-mode"] }
