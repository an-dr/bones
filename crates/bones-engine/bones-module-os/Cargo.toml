[package]
name = "bones-module-os"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Desktop OS capabilities for bones extensions: clipboard, browser, native file dialogs and HTTPS fetch."
publish.workspace = true

[dependencies]
arboard = "3.6"
base64 = "0.22"
# The bus lives in the kernel, not the facade: a module depending on
# `bones-engine` would cycle, since the facade composes the modules.
bones-kernel = { path = "../bones-kernel", default-features = false }
bones-messages = { path = "../../bones-messages" }
native-tls = "0.2"
open = "5.3"
rfd = "0.15"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
tempfile = "3.20"
