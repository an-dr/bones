[package]
name = "bones-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
description = "Selects an installed version and starts its application, without updating or kernel dependencies."

[[bin]]
name = "bones-launcher"
path = "src/bin/bones-launcher.rs"

[dependencies]
bones-versioning = { path = "../bones-versioning" }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.20"
