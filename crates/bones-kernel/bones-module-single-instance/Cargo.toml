[package]
name = "bones-module-single-instance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Single instance per user for a bones application: claim an app_uid before the kernel starts, and carry later launches onto the bus."
publish.workspace = true

[dependencies]
# The bus lives in the kernel infrastructure, not the facade: a module depending on
# `bones-kernel` would cycle, since the facade composes the modules.
bones-kernel-infra = { path = "../bones-kernel-infra", default-features = false }
bones-messages = { path = "../../bones-messages" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"
