[package]
name = "bones-module-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Registers an installed bones application with the desktop, directly from its installer or over the bus for one composition-fixed application."
publish.workspace = true

[dependencies]
dirs = "6.0.0"
# The bus lives in the kernel infrastructure, not the facade: a module depending on
# `bones-kernel` would cycle, since the facade composes the modules.
bones-kernel-infra = { path = "../bones-kernel-infra", default-features = false }
bones-messages = { path = "../../bones-messages" }

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
