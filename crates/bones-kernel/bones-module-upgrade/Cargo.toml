# "upgrade", not "update": Windows auto-elevates executables whose filename
# contains "update", "install", "setup" or "patch" -- this crate's own test
# binary included. See docs/adr/ADR-033.
[package]
name = "bones-module-upgrade"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Self-update on a guest's behalf: checks, stages and installs releases over the bus, with its own HTTPS download."
publish.workspace = true

[dependencies]
base64 = "0.22"
# The bus lives in the kernel infrastructure, not the facade: a module depending on
# `bones-kernel` would cycle, since the facade composes the modules.
bones-kernel-infra = { path = "../bones-kernel-infra", default-features = false }
bones-messages = { path = "../../bones-messages" }
bones-versioning = { path = "../../bones-versioning" }
dirs = "6.0.0"
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
tempfile = "3.20"
