[package]
name = "bones"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
web = ["bones-kernel/web"]

[dependencies]
# The shipped executable hosts extensions: that is its whole job (ADR-040).
bones-kernel = { path = "../bones-kernel", features = ["wasm"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
