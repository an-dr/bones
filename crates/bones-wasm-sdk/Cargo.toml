[workspace]

[package]
name = "bones-wasm-sdk"
# The ABI version line, shared with wit/core.wit's `bones:core` package and
# with bones-messages: this moves only when the guest contract changes, never
# with the engine's [workspace.package] version.
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/an-dr/bones"
readme = "README.md"
description = "Write a bones engine extension in Rust: the bones:core WIT package, its generated guest bindings, and the shared message vocabulary."

# Not on crates.io: generate! reads ../../wit, outside this package root, so no archive
# cargo builds here is self-contained.
# The 1.0 line is consumed by git tag; the repository README carries the
# exact dependency snippets and what support that promises.
publish = false

[features]
default = []
# The in-world UI toolkit (ADR-025). Optional: an extension that renders no
# game menu never compiles the geometry, selection, or hit-testing code.
game-ui = []

[dependencies]
wit-bindgen = "0.59.0"
bones-messages = { path = "../bones-messages" }
